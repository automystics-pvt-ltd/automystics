kind = "web"
previewPath = "/"
title = "Automystics - AI Automation Company"
version = "1.0.0"
id = "artifacts/automystics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19003

[services.development]
run = "pnpm --filter @workspace/automystics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/automystics", "run", "build" ]
publicDir = "artifacts/automystics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19003"
BASE_PATH = "/"
