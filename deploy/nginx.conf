# /etc/nginx/sites-available/automystics
# Replace YOUR_SERVER_IP_OR_DOMAIN below.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SERVER_IP_OR_DOMAIN;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static frontend (Vite build output)
    root /var/www/automystics/artifacts/automystics/dist/public;
    index index.html;

    # Hashed assets — cache aggressively
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API reverse proxy -> PM2 Node app
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # SPA fallback — every other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
